[package]
name = "nanofish"
version = "0.13.0"
edition = "2024"
rust-version = "1.91"
description = "🐟 A lightweight, `no_std` HTTP client and server for embedded systems with optional Embassy networking."
documentation = "https://docs.rs/nanofish"
repository = "https://github.com/rttfd/nanofish"
license = "MIT"
keywords = ["no_std", "embedded", "async", "http_client", "http_server"]
authors = ["rttf <contact@rttf.dev>"]

[features]
default = []
embassy = ["dep:embassy-net", "dep:embassy-time"]
smoltcp = ["dep:smoltcp"]
tls = ["dep:embedded-tls", "dep:rand_core", "embedded-tls/rustpki"]
defmt = ["dep:defmt", "embassy-net?/defmt"]
log = ["dep:log", "embassy-net?/log"]

[dependencies]
defmt = { version = "1.1.0", optional = true }
embassy-net = { version = "0.9.1", features = [
    "dns",
    "medium-ethernet",
    "proto-ipv4",
    "proto-ipv6",
    "tcp",
], optional = true }
embassy-time = { version = "0.5.1", optional = true }
embedded-io-async = "0.7.0"
embedded-tls = { version = "0.19.0", default-features = false, optional = true }
heapless = "0.9.3"
log = { version = "0.4", optional = true }
# Keep this on 0.6: embedded-tls 0.19 exposes rand_core 0.6 traits in its provider API,
# so newer rand_core versions are trait-incompatible until embedded-tls upgrades.
rand_core = { version = "0.6", optional = true }
smoltcp = { version = "0.13", default-features = false, features = ["async", "medium-ethernet", "proto-ipv4", "socket-tcp"], optional = true }

[dev-dependencies]
futures-lite = "2.6"

[lints.clippy]
panic = "forbid"
unwrap_used = "forbid"
expect_used = "forbid"
todo = "forbid"
unimplemented = "forbid"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
