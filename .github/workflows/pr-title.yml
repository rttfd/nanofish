# Copy to .github/workflows/pr-title.yml. The pull request title becomes the changelog line and
# decides the version, so it has a format: `type(scope): description`.
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
